version: "2"

linters:
  settings:
    errcheck:
      # CLI print helpers writing to stdout/stderr cannot meaningfully handle
      # write errors; all other error returns remain enforced.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

issues:
  # Report every finding. The defaults (max-same-issues=3,
  # max-issues-per-linter=50) silently hide duplicates and let real issues
  # slip through CI unnoticed.
  max-issues-per-linter: 0
  max-same-issues: 0
