name: Reject empty commits

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  reject-empty-commit:
    name: Reject empty commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fail when the commit introduces no file changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            if git diff --quiet "$base_sha" "$head_sha" -- .; then
              echo "No file changes were detected in this PR. Empty or no-op changes are not allowed."
              exit 1
            fi
            exit 0
          fi

          if git rev-list --count HEAD | grep -q '^1$'; then
            echo "Initial commit on this branch; no previous commit to compare against."
            exit 0
          fi

          if git diff --quiet HEAD^ HEAD -- .; then
            echo "Empty commit detected: HEAD contains no file changes."
            exit 1
          fi
