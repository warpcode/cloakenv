name: Build & Release

on:
  schedule:
    - cron: '0 0 * * *' # Run nightly at midnight UTC
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write  # Required to create/update releases and push tags
  actions: write # Required to update workflow files when pushing tags
  id-token: write # Required for Cosign keyless signing and SLSA provenance via GitHub OIDC
  attestations: write # Required for GitHub artifact attestations (SLSA provenance)

jobs:
  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

  build-and-publish:
    name: Build & Publish
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}
          fetch-depth: 0 # Essential for tagging and tag manipulation

      - name: Check for recent commits on main
        id: check-commits
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COMMITS=$(git log origin/main --since="24 hours ago" --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No commits on main in the last 24 hours. Skipping nightly build."
              echo "has_commits=false" >> $GITHUB_OUTPUT
            else
              echo "Found commits on main in the last 24 hours:"
              echo "$COMMITS"
              echo "has_commits=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Triggered manually or via tag push."
            echo "has_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check-commits.outputs.has_commits == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get Commit Info & Set Dev Tag Name
        if: steps.check-commits.outputs.has_commits == 'true'
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format=%s)" >> $GITHUB_ENV
          BASE_TAG="dev-$(date -u +'%Y-%m-%d')"
          DEV_TAG="${BASE_TAG}"

          # Probe if the base tag can be created on origin, or fallback to an incremental suffix
          # if GitHub locked the tag name due to a prior immutable release.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            if ! git push origin "HEAD:refs/tags/${DEV_TAG}" 2>/dev/null; then
              SUFFIX=1
              while ! git push origin "HEAD:refs/tags/${BASE_TAG}.${SUFFIX}" 2>/dev/null; do
                SUFFIX=$((SUFFIX + 1))
                if [ "${SUFFIX}" -gt 20 ]; then
                  echo "Failed to create dev tag on origin after 20 attempts" >&2
                  exit 1
                fi
              done
              DEV_TAG="${BASE_TAG}.${SUFFIX}"
            fi
            git tag -f "${DEV_TAG}" HEAD
          fi
          echo "DEV_TAG=${DEV_TAG}" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" --exclude "${CURRENT_TAG}" HEAD 2>/dev/null || true)
            if [ -n "${PREV_TAG}" ]; then
              RANGE="${PREV_TAG}..HEAD"
              COMPARE_HEADER="**Full Changelog**: [\`${PREV_TAG}...${CURRENT_TAG}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG})"
            else
              RANGE="HEAD"
              COMPARE_HEADER="**Full Changelog**: [\`${CURRENT_TAG}\`](https://github.com/${GITHUB_REPOSITORY}/commits/${CURRENT_TAG})"
            fi
          else
            CURRENT_TAG="${DEV_TAG}"
            PREV_TAG=$(git describe --tags --abbrev=0 --match "dev-*" --exclude "${CURRENT_TAG}" HEAD 2>/dev/null || true)
            if [ -n "${PREV_TAG}" ]; then
              RANGE="${PREV_TAG}..HEAD"
              COMPARE_HEADER="**Full Changelog**: [\`${PREV_TAG}...${CURRENT_TAG}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG})"
            else
              RANGE="HEAD"
              COMPARE_HEADER="**Full Changelog**: [\`${CURRENT_TAG}\`](https://github.com/${GITHUB_REPOSITORY}/commits/${CURRENT_TAG})"
            fi
          fi
          echo "CURRENT_TAG=${CURRENT_TAG}" >> $GITHUB_ENV

          COMMITS_LIST=$(git log --first-parent --pretty=format:"- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s (%an)" ${RANGE})
          if [ -z "${COMMITS_LIST}" ]; then
            COMMITS_LIST=$(git log -1 --first-parent --pretty=format:"- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s (%an)" HEAD)
          fi

          VERIFICATION_DOCS=$(cat <<EOF

### Verification & Attestation

Release artifacts are cryptographically signed with [Sigstore/Cosign](https://github.com/sigstore/cosign) via GitHub Actions keyless OIDC, and attested with SLSA Level 3 build provenance.

**Verify Checksums with Cosign:**
\`\`\`bash
# Keyless verification with Sigstore bundle
cosign verify-blob \\
  --bundle checksums.txt.sigstore.json \\
  --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \\
  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
  checksums.txt

# Or verify with detached signature and certificate
cosign verify-blob \\
  --signature checksums.txt.sig \\
  --certificate checksums.txt.pem \\
  --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \\
  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
  checksums.txt

# Verify archive integrity
sha256sum --ignore-missing -c checksums.txt
\`\`\`

**Verify SLSA Build Provenance:**
\`\`\`bash
gh attestation verify <archive-filename> --owner ${GITHUB_REPOSITORY%/*}
\`\`\`
EOF
)

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cat <<EOF > release-notes.md
          ## What's Changed

          ### Commits & Merges
          ${COMMITS_LIST}

          ${COMPARE_HEADER}
          ${VERIFICATION_DOCS}
          EOF
          else
            cat <<EOF > release-notes.md
          These are the latest development binaries of \`cloakenv\` compiled from \`main\`.

          > [!WARNING]
          > These builds are compiled automatically from the latest commits to \`main\` and may be unstable.

          **Latest Commit**: [\`$(git rev-parse --short HEAD)\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) - *"$(git log -1 --format=%s)"*

          ## What's Changed

          ### Commits & Merges
          ${COMMITS_LIST}

          ${COMPARE_HEADER}
          ${VERIFICATION_DOCS}
          EOF
          fi

      - name: Build All Targets
        if: steps.check-commits.outputs.has_commits == 'true'
        run: |
          mkdir -p dist

          VERSION="${CURRENT_TAG:-${{ github.ref_name }}}"
          COMMIT="${GITHUB_SHA}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "Injecting version metadata: version=${VERSION}, commit=${COMMIT}, date=${BUILD_DATE}"

          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE} -X github.com/warpcode/cloakenv/internal/cmd.Version=${VERSION} -X github.com/warpcode/cloakenv/internal/cmd.Commit=${COMMIT} -X github.com/warpcode/cloakenv/internal/cmd.BuildDate=${BUILD_DATE}"
          
          # List of GOOS/GOARCH/PlatformSuffix mappings
          targets=(
            "linux/amd64/linux-amd64"
            "linux/arm64/linux-arm64"
            "linux/arm/linux-arm"
            "darwin/amd64/macos-amd64"
            "darwin/arm64/macos-arm64"
            "windows/amd64/windows-amd64"
            "windows/arm64/windows-arm64"
          )
          
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch platform_name <<< "$target"
            echo "Building and packaging for ${goos}/${goarch}..."

            STAGE_DIR=$(mktemp -d)
            BINARY_NAME="cloakenv"
            if [ "${goos}" = "windows" ]; then
              BINARY_NAME="cloakenv.exe"
            fi

            # -s -w linker flags strip debug information and symbols to minimize binary size
            CGO_ENABLED=0 GOOS=${goos} GOARCH=${goarch} go build \
              -ldflags="${LDFLAGS}" \
              -o "${STAGE_DIR}/${BINARY_NAME}" \
              .

            cp README.md LICENSE "${STAGE_DIR}/"

            if [ "${goos}" = "windows" ]; then
              (cd "${STAGE_DIR}" && zip -9 -q "${GITHUB_WORKSPACE}/dist/cloakenv-${platform_name}.zip" "${BINARY_NAME}" README.md LICENSE)
            else
              tar -czf "dist/cloakenv-${platform_name}.tar.gz" -C "${STAGE_DIR}" "${BINARY_NAME}" README.md LICENSE
            fi

            rm -rf "${STAGE_DIR}"
          done

      - name: Generate Checksums
        if: steps.check-commits.outputs.has_commits == 'true'
        run: |
          cd dist
          sha256sum cloakenv-*.tar.gz cloakenv-*.zip > checksums.txt
          cat checksums.txt

      - name: Install Cosign
        if: steps.check-commits.outputs.has_commits == 'true'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign Release Artifacts with Cosign
        if: steps.check-commits.outputs.has_commits == 'true'
        run: |
          cd dist
          echo "Signing checksums.txt with Cosign..."
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          cosign sign-blob --yes --output-signature checksums.txt.sig --output-certificate checksums.txt.pem checksums.txt

          for archive in cloakenv-*.tar.gz cloakenv-*.zip; do
            if [ -f "${archive}" ]; then
              echo "Signing ${archive} with Cosign..."
              cosign sign-blob --yes --bundle "${archive}.sigstore.json" "${archive}"
              cosign sign-blob --yes --output-signature "${archive}.sig" --output-certificate "${archive}.pem" "${archive}"
            fi
          done

      - name: Verify Cosign Signatures
        if: steps.check-commits.outputs.has_commits == 'true'
        run: |
          cd dist
          echo "Verifying checksums.txt keyless signatures..."
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          cosign verify-blob \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt

      - name: Generate SLSA Build Provenance
        if: steps.check-commits.outputs.has_commits == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/cloakenv-*.tar.gz
            dist/cloakenv-*.zip
            dist/checksums.txt

      # ----------------------------------------------------
      # Mode A: Dev Release (Nightly or manual dispatch)
      # ----------------------------------------------------
      - name: Publish Dev Release
        id: publish-dev-release
        if: |
          steps.check-commits.outputs.has_commits == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEV_TAG }}
          name: "Development Build (${{ env.DEV_TAG }})"
          body_path: release-notes.md
          prerelease: true
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sigstore.json
            dist/*.sig
            dist/*.pem

      - name: Undraft Dev Release
        if: |
          steps.check-commits.outputs.has_commits == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${DEV_TAG}" --draft=false

      # ----------------------------------------------------
      # Mode B: Official Release (For Version Tag Pushes)
      # ----------------------------------------------------
      - name: Publish Official Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sigstore.json
            dist/*.sig
            dist/*.pem
          draft: false
          prerelease: false
          generate_release_notes: false
