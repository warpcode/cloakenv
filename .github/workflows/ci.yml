name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: ${{ github.event_name == 'push' }}

      - name: Initialize lint report
        run: |
          printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"golangci-lint"}},"results":[]}]}\n' > "$RUNNER_TEMP/golangci-report.sarif"

      - name: golangci-lint
        id: lint
        continue-on-error: true
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --output.sarif.path="$RUNNER_TEMP/golangci-report.sarif"

      - name: Upload lint report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: golangci-report
          path: ${{ runner.temp }}/golangci-report.sarif
          if-no-files-found: error

      - name: Preserve lint failure
        if: always() && steps.lint.outcome == 'failure'
        run: exit 1

  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: ${{ github.event_name == 'push' }}

      - name: Test SARIF publisher
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/test_sarif_to_comment.sh

      - name: Run Tests
        id: tests
        shell: bash
        env:
          TEST_REPORT: ${{ runner.temp }}/go-test-${{ matrix.os }}.log
        run: |
          touch "$TEST_REPORT"
          set +e
          go test -v -race ./... 2>&1 | tee "$TEST_REPORT"
          test_status=${PIPESTATUS[0]}
          exit "$test_status"

      - name: Convert test output to SARIF
        if: always() && github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        env:
          TEST_REPORT: ${{ runner.temp }}/go-test-${{ matrix.os }}.log
          TEST_SARIF: ${{ runner.temp }}/go-test-${{ matrix.os }}.sarif
          TAIL_REPORT: ${{ runner.temp }}/go-test-${{ matrix.os }}-tail.log
        run: |
          tail -n 2000 "$TEST_REPORT" > "$TAIL_REPORT"
          jq -Rn '
            [inputs] as $lines |
            [
              $lines[] |
              try (capture("^[[:space:]]+(?<path>[a-zA-Z0-9_./\\\\-]+\\.go):(?<line>[0-9]+):[[:space:]]*(?<message>.*)") as $location |
              {
                ruleId: "go-test",
                level: "error",
                message: {text: $location.message},
                locations: [{
                  physicalLocation: {
                    artifactLocation: {uri: $location.path},
                    region: {startLine: ($location.line | tonumber)}
                  }
                }]
              }) catch empty
            ] + [
              $lines[] |
              try (capture("^--- FAIL:[[:space:]]+(?<test>[A-Za-z0-9_]+)") as $fail |
              {ruleId: "go-test-failure", level: "error", message: {text: "Test failed: \($fail.test)"}}) catch empty
            ] as $results |
            ($results | .[:50]) as $capped_results |
            {
              version: "2.1.0",
              runs: [{
                tool: {driver: {name: "go test"}},
                results: $capped_results
              }]
            }
          ' "$TAIL_REPORT" > "$TEST_SARIF"

      - name: Upload Test SARIF
        if: always() && github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: go-test-sarif-${{ matrix.os }}
          path: ${{ runner.temp }}/go-test-${{ matrix.os }}.sarif
          if-no-files-found: error

  publish-lint-review:
    name: Publish Lint and Test Review
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [golangci, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download lint report
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: golangci-report
          path: ${{ runner.temp }}/lint-report

      - name: Download test SARIF reports
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: go-test-sarif-*
          path: ${{ runner.temp }}/test-reports
          merge-multiple: true

      - name: Publish findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOLANGCI_STATUS: ${{ needs.golangci.result }}
          TEST_STATUS: ${{ needs.test.result }}
        run: |
          reports=()
          lint_report="$RUNNER_TEMP/lint-report/golangci-report.sarif"
          if [[ -f "$lint_report" ]]; then
            reports+=("$lint_report")
          fi
          for report in "$RUNNER_TEMP"/test-reports/*.sarif; do
            [[ -f "$report" ]] && reports+=("$report")
          done
          if ((${#reports[@]} == 0)); then
            if [[ "${GOLANGCI_STATUS}" == "failure" || "${TEST_STATUS}" == "failure" ]]; then
              echo "::error::CI checks failed (golangci: ${GOLANGCI_STATUS}, test: ${TEST_STATUS}) but no SARIF reports were downloaded." >&2
              exit 1
            fi
            echo "No SARIF reports were downloaded; CI status checks remain authoritative."
            exit 0
          fi
          bash .github/scripts/sarif-to-comment.sh "${reports[@]}"
