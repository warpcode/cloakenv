# cloakenv example configuration
# Place this file at: ~/.config/cloakenv/config.yaml

# Cache configurations
cache:
  default_ttl: "10m"

# Keyring configurations
keyring:
  prefix: "cloakenv"
  isolate: false

# Audit logging (records URI/vault access metadata, never secret values)
audit:
  enabled: false
  log_path: "~/.config/cloakenv/audit.jsonl"
  format: "jsonl"

# Configured read-only vaults (pure retrieval backends; env and keyring are built-in)
vaults:
  work:
    provider: "keepass"
    vault_path: "~/secrets/work.kdbx"
    resolve_references: false
    cache:
      enabled: true
      ttl: "15m"
      mode: "keyring"

  unix_pass:
    provider: "pass"
    vault_path: "~/.password-store"
    query: "work/"

  hcp_vault:
    provider: "vault"
    address: "https://vault.example.com:8200"
    mount_path: "secret"
    engine_version: 2
    query: "prod/"

  process_env:
    provider: "env"
    query: "AWS_*"

  os_keyring:
    provider: "keyring"
    query: "OPENAI_API_KEY,NVIDIA_NIM_API_KEY"

# Declarative environment sets with RuleEngine transformations
envs:
  aws_env:
    - vault: "work"
      query: '{{ hasTag "aws" .tags }}'
      rules:
        - type: pass
          include: ["AWS_*"]
          exclude: ["*_NOTES"]
          key_format: "env"

  ai_env:
    - vault: "os_keyring"
      rules:
        - type: pass
          include: ["OPENAI_*", "NVIDIA_*"]
        - type: set
          values:
            LITELLM_LOG: "INFO"

# Declarative template artifact generators
templates:
  app_dotenv:
    driver: "dotenv"
    from_env: "ai_env"

  service_json:
    driver: "json"
    vaults:
      - vault: "work"
        query: '{{ eq .title "Service Account" }}'
        rules:
          - type: pass
            exclude: ["Notes"]

  custom_env_file:
    driver: "template"
    path: "./template.env"
    vaults:
      - vault: "work"
        query: '{{ hasTag "app" .tags }}'

# Command autoloading rules
autoload:
  - match: '^litellm\s+(.*)$'
    command: "uvx --with 'litellm[proxy]' litellm \\1"
    envs:
      - "ai_env"
    templates:
      - template: "app_dotenv"
        env_path: "LITELLM_ENV_FILE"

  - match: '^aws(\s|$)'
    envs:
      - "aws_env"
      - AWS_DEFAULT_REGION: "us-east-1"
